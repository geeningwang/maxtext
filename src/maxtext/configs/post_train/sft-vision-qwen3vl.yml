base_config: "base.yml"

# -------------- SFT settings --------------
use_sft: True
use_tunix_gradient_accumulation: True
use_multimodal: True
# Only train on completion (assistant response) tokens; image and query tokens
# are masked out of the loss via SFTPromptMaskingVision + targets_segmentation.
sft_train_on_completion_only: True
packing: False  # packing is not supported for multimodal SFT
freeze_vision_encoder_params: True
learning_rate: 2.e-5

# -------------- Model --------------
model_name: qwen3-vl-2b
# Path to the HuggingFace tokenizer (downloaded by generate_hf_qwen3_vl_checkpoint.py)
tokenizer_path: tests/assets/qwen3_vl_2b_hf
# Path to the MaxText Orbax checkpoint (generated by the same script)
load_parameters_path: tests/assets/qwen3_vl_2b_orbax/0/items
enable_checkpointing: True

# -------------- Vision settings (inherited from model config, listed here for clarity) --------------
# use_mrope: true                  # set in qwen3-vl-2b.yml
# mrope_section: [24, 20, 20]      # set in qwen3-vl-2b.yml
# patch_size_for_vit: 16           # set in qwen3-vl-2b.yml
# spatial_merge_size_for_vit: 2    # set in qwen3-vl-2b.yml
# temporal_patch_size_for_vit: 2   # set in qwen3-vl-2b.yml

# Maximum images per training example. Qwen3-VL supports multi-image inputs;
# start with 1 for simplicity and increase as needed.
max_num_images_per_example: 1

# Generic image placeholder that reformat_prompt_qwen3_vl will replace with
# <|vision_start|><|image_pad|><|vision_end|>.
image_placeholder: "<|image|>"

# -------------- HF dataset (ChartQA as default; override for other datasets) --------------
dataset_type: hf
hf_path: 'HuggingFaceM4/ChartQA'
train_split: 'train'
hf_eval_split: 'val'
# First column = prompt/query, second column = completion/response.
train_data_columns: ['query', 'label']
eval_data_columns: ['query', 'label']
# Name of the image column in the HuggingFace dataset.
train_image_column: 'image'
eval_image_column: 'image'
