# FP8 Checkpoint Conversion Job
# ==============================
# Converts the HF FP8 safetensors checkpoint to a MaxText Orbax (zarr2)
# checkpoint while preserving the FP8 quantization (--keep_fp8).
#
# The resulting checkpoint stores:
#   - Weights as float8_e4m3fn (uint8 bits in zarr) at ~310 GB total
#   - Scale tensors as float32 under "<weight_key>_scale_inv"
# compared to ~620 GB for the BF16 version.
#
# Prerequisites (one-time setup)
# --------------------------------
# The default GKE node pool only has ~13 GiB RAM per node, which is
# insufficient for streaming conversion (~50 GiB RAM per MoE layer peak).
# Create a dedicated high-RAM CPU node pool first:
#
#   gcloud container node-pools create jingnw-cpu-highmem \
#     --cluster jingnw-tpu7-cluster \
#     --zone us-central1-c \
#     --project tpu-launchpad-playground \
#     --machine-type n2-highmem-16 \
#     --num-nodes 1 \
#     --disk-size 200 \
#     --no-enable-autoupgrade
#
# n2-highmem-16 provides 16 vCPUs and 128 GiB RAM, comfortably above the
# ~50 GiB peak required by --streaming_save mode.
#
# Usage
# -----
#   kubectl apply -f tools/orchestration/convert_fp8_checkpoint_job.yaml
#   kubectl logs -f job/mimo-v2-flash-fp8-convert
#
# After the job completes, verify the output:
#   gsutil ls gs://jingnw-mimo-v2-flash-us-central1/mimo-v2-flash-fp8-ocdbt/
#
# Inference with the FP8 checkpoint (future)
# -------------------------------------------
# Once MaxText's FP8 native-checkpoint loading path is available:
#   --checkpoint_path gs://jingnw-mimo-v2-flash-us-central1/mimo-v2-flash-fp8-ocdbt/checkpoints/0/items
#   MaxText flags: quantization=fp8_full checkpoint_is_quantized=true
#
# Cleanup
#   kubectl delete job mimo-v2-flash-fp8-convert
#   gcloud container node-pools delete jingnw-cpu-highmem \
#     --cluster jingnw-tpu7-cluster --zone us-central1-c --project tpu-launchpad-playground

apiVersion: batch/v1
kind: Job
metadata:
  name: mimo-v2-flash-fp8-convert
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: mimo-v2-flash-fp8-convert
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: jingnw-cpu-highmem
      containers:
      - name: fp8-convert
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.8.1-rev1
        securityContext:
          privileged: true
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          export PATH="/opt/venv/bin:${PATH}"
          export PYTHONUNBUFFERED=1
          # JAX on CPU only — no TPU needed for conversion.
          export JAX_PLATFORMS=cpu

          # ---- Install gcsfuse to access GCS buckets as local filesystems ----
          echo "[setup] Installing gcsfuse..."
          apt-get update -q -y
          apt-get install -y -q curl gnupg fuse
          curl -s https://packages.cloud.google.com/apt/doc/apt-key.gpg \
            | gpg --dearmor -o /usr/share/keyrings/cloud.google.asc
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.asc] https://packages.cloud.google.com/apt gcsfuse-bookworm main" \
            > /etc/apt/sources.list.d/gcsfuse.list
          apt-get update -q -y && apt-get install -y -q gcsfuse
          echo "[setup] gcsfuse installed."

          # ---- Mount source bucket (HF FP8 model, read-only) ----
          mkdir -p /mnt/hf-model
          gcsfuse --implicit-dirs --only-dir hf-model \
            jingnw-mimo-v2-flash-us-east5 /mnt/hf-model
          echo "[setup] Mounted gs://jingnw-mimo-v2-flash-us-east5/hf-model/ at /mnt/hf-model"
          ls /mnt/hf-model/*.safetensors 2>/dev/null | wc -l | xargs -I{} echo "[setup] {} safetensors shards visible"

          # ---- Mount output bucket ----
          mkdir -p /mnt/output
          gcsfuse --implicit-dirs \
            jingnw-mimo-v2-flash-us-central1 /mnt/output
          echo "[setup] Mounted gs://jingnw-mimo-v2-flash-us-central1/ at /mnt/output"
          # Test write access via GCS API (gsutil) before committing to gcsfuse writes
          echo "gcsfuse_write_test" | gsutil cp - gs://jingnw-mimo-v2-flash-us-central1/_write_test.txt \
            && gsutil rm gs://jingnw-mimo-v2-flash-us-central1/_write_test.txt \
            && echo "[setup] GCS write access OK" \
            || { echo "[setup] ERROR: no write access to jingnw-mimo-v2-flash-us-central1"; exit 1; }
          # No explicit mkdir needed — the conversion script creates directories itself

          # ---- Clone repo and install deps ----
          WORKDIR=/workspace
          rm -rf "${WORKDIR}"
          git clone https://github.com/geeningwang/maxtext.git "${WORKDIR}"
          cd "${WORKDIR}"
          git checkout tpu-v7x-porting

          /opt/venv/bin/python -m pip install -e "." --quiet
          /opt/venv/bin/python -m pip install "safetensors" "numcodecs" "zarr>=2,<3" "ml_dtypes" --quiet

          echo "[convert] Starting FP8 checkpoint conversion (streaming_save + keep_fp8)..."
          echo "[convert] Source : /mnt/hf-model  (gs://jingnw-mimo-v2-flash-us-east5/hf-model/)"
          echo "[convert] Output : /mnt/output/mimo-v2-flash-fp8-ocdbt  (gs://jingnw-mimo-v2-flash-us-central1/mimo-v2-flash-fp8-ocdbt/)"

          /opt/venv/bin/python \
            src/maxtext/checkpoint_conversion/standalone_scripts/convert_mimo_v2_flash.py \
            --base_model_path /mnt/hf-model \
            --maxtext_model_path /mnt/output/mimo-v2-flash-fp8-ocdbt \
            --streaming_save \
            --keep_fp8

          echo "[convert] Done. Listing output checkpoint:"
          ls /mnt/output/mimo-v2-flash-fp8-ocdbt/
        resources:
          requests:
            cpu: "12"
            memory: 110Gi
          limits:
            cpu: "14"
            memory: 110Gi
