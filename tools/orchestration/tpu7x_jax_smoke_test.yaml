apiVersion: batch/v1
kind: Job
metadata:
  name: tpu7x-jax-smoke-test
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: tpu7x-jax-smoke-test
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: jingnw-flex-tpu7
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      tolerations:
      - key: google.com/tpu
        operator: Equal
        value: present
        effect: NoSchedule
      containers:
      - name: jax-smoke-test
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.8.1-rev1
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          /opt/venv/bin/python - <<'PY'
          import jax
          import jaxlib

          print("JAX_VERSION", jax.__version__)
          print("JAXLIB_VERSION", jaxlib.__version__)
          print("LOCAL_DEVICE_COUNT", jax.local_device_count())
          print("DEVICE_COUNT", jax.device_count())
          print("DEVICES", [str(device) for device in jax.devices()])
          PY
        ports:
        - containerPort: 8431
        resources:
          requests:
            cpu: "10"
            memory: 32Gi
            google.com/tpu: "4"
          limits:
            cpu: "10"
            memory: 32Gi
            google.com/tpu: "4"