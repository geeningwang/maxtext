# MiMo-V2.5-Pro inference smoke-test job — GKE multi-host (2x2x2, 8 chips, 16 JAX devices)
#
# Cluster:   jingnw-tpu7-cluster  (us-central1-c)
# Node pool: jingnw-flex-tpu7-8ch  (tpu7x-standard-4t, 2x2x2 topology, Flex Start)
#            2 nodes × 4 chips each = 8 chips = 16 JAX devices
#
# Parallelism: TP=8, EP=2  (8×2=16 devices)
# HBM budget:  ~71 GB weights / 80 GB usable per device  → ~9 GB XLA headroom
#              scan_layers=true: stacked checkpoint, XLA compiles 1 layer body at a time
#
# Pre-requisites:
#   1. Stacked checkpoint (CPU stacker, Phase 5):
#      gs://jingnw-mimo-v2-5-pro-us-central1/mimo-v2-5-pro-fp8-ocdbt-stacked-cpu/0/items
#   2. Node pool jingnw-flex-tpu7-8ch available (autoscales from 0)
#   3. Broken 16ch pool cleaned up (see env_restore.md pending cleanup section)
#
# Apply:
#   kubectl apply -f tools/orchestration/mimo_v2_5_pro_inference_job.yaml
#
# Monitor:
#   kubectl logs -f -l job-name=mimo-v25-pro-inference --prefix
#
# Clean up:
#   kubectl delete job mimo-v25-pro-inference
#   kubectl delete service mimo-v25-pro-inference

# ---------------------------------------------------------------------------
# Headless Service — gives pod-0 a stable DNS name for coordinator discovery.
# Pod-0 is reachable at:
#   mimo-v25-pro-inference-0.mimo-v25-pro-inference.<namespace>.svc.cluster.local
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mimo-v25-pro-inference
  namespace: default
spec:
  clusterIP: None   # headless: DNS returns pod IPs directly
  selector:
    job-name: mimo-v25-pro-inference

---
# ---------------------------------------------------------------------------
# Indexed Job — 2 pods, one per TPU node (4 chips each).
# completionMode: Indexed sets JOB_COMPLETION_INDEX=0 on worker-0 and =1 on worker-1.
# Both pods must start simultaneously; JAX handles ICI coordination internally.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: mimo-v25-pro-inference
  namespace: default
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        job-name: mimo-v25-pro-inference
      annotations:
        cluster-autoscaler.kubernetes.io/consume-provisioning-request: mimo-v25-pro-dws
        cluster-autoscaler.kubernetes.io/provisioning-class-name: queued-provisioning.gke.io
        cluster-autoscaler.kubernetes.io/provisioning-class-name: queued-provisioning.gke.io
    spec:
      restartPolicy: Never
      # subdomain + headless Service gives pod-0 a stable DNS hostname:
      #   mimo-v25-pro-inference-0.mimo-v25-pro-inference.default.svc.cluster.local
      subdomain: mimo-v25-pro-inference
      nodeSelector:
        cloud.google.com/gke-nodepool: jingnw-dws-tpu7-8ch
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x2
      tolerations:
      - key: google.com/tpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: cloud.google.com/gke-queued
        operator: Equal
        value: "true"
        effect: NoSchedule
      containers:
      - name: mimo-v25-pro-inference
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.8.1-rev1
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NODE_RANK
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        # Worker-0 is the JAX coordinator; all workers connect to its address.
        - name: JAX_COORDINATOR_ADDRESS
          value: "mimo-v25-pro-inference-0.mimo-v25-pro-inference.default.svc.cluster.local:6006"
        - name: JAX_COORDINATOR_PORT
          value: "6006"
        - name: NNODES
          value: "2"
        - name: JAX_LOG_COMPILES
          value: "1"
        - name: TF_CPP_MIN_LOG_LEVEL
          value: "0"
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          export PATH="/opt/venv/bin:${PATH}"

          # Persist logs to GCS so they survive pod failure / preemption.
          # Background loop uploads every 30 s; EXIT trap does a final upload.
          LOG_START=$(date -u +%Y%m%d_%H%M%S)
          LOG_FILE=/tmp/mimo_run.log
          GCS_LOG="gs://jingnw-mimo-v2-5-pro-us-central1/inference-logs/${LOG_START}_rank${NODE_RANK}.log"
          exec > >(tee "${LOG_FILE}") 2>&1
          (while true; do sleep 30; gsutil -q cp "${LOG_FILE}" "${GCS_LOG}" || true; done) &
          UPLOADER_PID=$!
          trap "gsutil -q cp '${LOG_FILE}' '${GCS_LOG}' || true; kill ${UPLOADER_PID} 2>/dev/null || true" EXIT
          echo "[mimo-v25-pro] Logs mirrored to ${GCS_LOG} every 30 s"

          # Clone branch and install.
          WORKDIR=/workspace
          rm -rf "${WORKDIR}"
          git clone https://github.com/geeningwang/maxtext.git "${WORKDIR}"
          cd "${WORKDIR}"
          git checkout MiMo-V2.5-Pro
          /opt/venv/bin/python -m pip install -e ".[tpu]"
          install_maxtext_tpu_github_deps
          /opt/venv/bin/python -m pip install transformers safetensors huggingface_hub

          echo "[mimo-v25-pro] NODE_RANK=${NODE_RANK}  JAX_COORDINATOR_ADDRESS=${JAX_COORDINATOR_ADDRESS}"
          echo "[mimo-v25-pro] Starting inference smoke test..."

          # Phase 6 smoke test: single-token decode at batch=1.
          # Call decode.py directly (not via demo wrapper) for full stderr visibility.
          #
          # Checkpoint format flags must match stacked checkpoint _METADATA:
          #   use_ocdbt=false, use_zarr3=false  (zarr2, written by CPU stacker)
          # scan_layers=true: stacked checkpoint layout (8-phase), XLA compiles 1 layer body.
          # async_checkpointing=false: required with scan_layers=true (shape mismatch otherwise).
          # mimo_fp8_weight_mode=block_wise_fp8: expert weights in float8_e4m3fn,
          #   dequantized per 128×128 block to BF16 before each MoE matmul.
          /opt/venv/bin/python -m maxtext.inference.decode \
            src/maxtext/configs/base.yml \
            model_name=mimo-v2-5-pro \
            run_name=mimo_v2_5_pro_smoke_test \
            "load_parameters_path=gs://jingnw-mimo-v2-5-pro-us-central1/mimo-v2-5-pro-fp8-ocdbt-stacked-cpu/0/items" \
            tokenizer_path=XiaomiMiMo/MiMo-V2.5-Pro \
            tokenizer_type=huggingface \
            "prompt=Hello, what is 1+1?" \
            max_prefill_predict_length=512 \
            max_target_length=544 \
            per_device_batch_size=1 \
            dtype=bfloat16 \
            weight_dtype=bfloat16 \
            ici_tensor_parallelism=8 \
            ici_expert_parallelism=2 \
            scan_layers=true \
            async_checkpointing=false \
            attention=dot_product \
            expert_shard_attention_option=context \
            checkpoint_storage_use_ocdbt=false \
            checkpoint_storage_use_zarr3=false \
            mimo_fp8_weight_mode=block_wise_fp8 \
            "jax_cache_dir=gs://jingnw-mimo-v2-5-pro-us-central1/jax-compilation-cache" \
            use_chat_template=true \
            decode_sampling_strategy=nucleus \
            decode_sampling_nucleus_p=0.95 \
            decode_sampling_temperature=0.6

        resources:
          requests:
            cpu: "220"
            memory: 192Gi
            google.com/tpu: "4"   # 4 chips per node; 2 nodes = 8 chips total
          limits:
            cpu: "220"
            memory: 192Gi
            google.com/tpu: "4"
