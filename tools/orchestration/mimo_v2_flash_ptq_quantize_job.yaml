apiVersion: batch/v1
kind: Job
metadata:
  name: mimo-v2-flash-ptq-quantize
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: mimo-v2-flash-ptq-quantize
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: jingnw-flex-tpu7
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      tolerations:
      - key: google.com/tpu
        operator: Equal
        value: present
        effect: NoSchedule
      containers:
      - name: mimo-ptq-quantize
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.8.1-rev1
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          export PATH="/opt/venv/bin:${PATH}"
          export PYTHONUNBUFFERED=1
          WORKDIR=/workspace
          rm -rf "${WORKDIR}"
          git clone https://github.com/geeningwang/maxtext.git "${WORKDIR}"
          cd "${WORKDIR}"
          git checkout MiMo-V2-Flash
          /opt/venv/bin/python -m pip install -e ".[tpu]"
          install_maxtext_tpu_github_deps
          /opt/venv/bin/python -m pip install transformers safetensors huggingface_hub
          # Run offline PTQ quantization on TPU with TP=4, EP=2 sharding.
          # Each chip holds ~51 GB BF16 + ~26 GB FP8 = ~77 GB peak, fits in 94.75 GiB HBM.
          # MoE expert weights (gmm/ragged_dot) remain in BF16; attention layers -> FP8.
          /opt/venv/bin/python \
            -m maxtext.checkpoint_conversion.standalone_scripts.quantize_params_ptq \
            src/maxtext/configs/base.yml \
            model_name=mimo-v2-flash \
            run_name=mimo_ptq_quantize \
            load_parameters_path=gs://jingnw-mimo-v2-flash-us-central1/mimo-v2-flash-fixed-ocdbt/checkpoints/0/items \
            save_quantized_params_path=gs://jingnw-mimo-v2-flash-us-central1/mimo-v2-flash-fp8-ptq/0/items \
            use_qwix_quantization=true \
            quantization=fp8_full \
            checkpoint_is_quantized=false \
            ici_tensor_parallelism=4 \
            ici_expert_parallelism=2 \
            max_target_length=128 \
            per_device_batch_size=1 \
            attention=dot_product \
            enable_single_controller=true \
            checkpoint_storage_use_ocdbt=true \
            checkpoint_storage_use_zarr3=false \
            async_checkpointing=false
        resources:
          requests:
            cpu: "10"
            memory: 64Gi
            google.com/tpu: "4"
          limits:
            cpu: "10"
            memory: 64Gi
            google.com/tpu: "4"
