apiVersion: v1
kind: Service
metadata:
  name: mimo-ptq-headless
spec:
  clusterIP: None
  selector:
    job-name: mimo-v2-flash-ptq-quantize
  ports:
  - name: jax
    port: 8471
    targetPort: 8471
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mimo-v2-flash-ptq-quantize
spec:
  # 2-worker indexed job targeting the 2x2x2 multi-host TPU slice (8 chips, 16 JAX devices).
  # Each worker runs on one tpu7x-standard-4t node (4 chips / 8 JAX devices).
  # Memory per device: 412 GB BF16 / 16 devices = 25.75 GB < 47 GiB HBM.
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: mimo-v2-flash-ptq-quantize
    spec:
      # subdomain enables stable DNS: <job-name>-<index>.mimo-ptq-headless.default.svc.cluster.local
      subdomain: mimo-ptq-headless
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: jingnw-flex-tpu7-8ch
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x2
      tolerations:
      - key: google.com/tpu
        operator: Equal
        value: present
        effect: NoSchedule
      containers:
      - name: mimo-ptq-quantize
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:jax0.8.1-rev1
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          export PATH="/opt/venv/bin:${PATH}"
          export PYTHONUNBUFFERED=1
          WORKDIR=/workspace
          rm -rf "${WORKDIR}"
          git clone https://github.com/geeningwang/maxtext.git "${WORKDIR}"
          cd "${WORKDIR}"
          git checkout MiMo-V2-Flash
          /opt/venv/bin/python -m pip install -e ".[tpu]"
          install_maxtext_tpu_github_deps
          /opt/venv/bin/python -m pip install transformers safetensors huggingface_hub

          # Override TPU worker addresses: GKE may inject 'localhost' for single-host.
          # The headless service + subdomain gives stable DNS for each indexed pod.
          JOB="mimo-v2-flash-ptq-quantize"
          SVC="mimo-ptq-headless"
          W0="${JOB}-0.${SVC}"
          W1="${JOB}-1.${SVC}"
          # Wait for both workers to be DNS-resolvable before starting JAX.
          for w in "$W0" "$W1"; do
            echo "[$HOSTNAME] Waiting for $w to resolve..."
            for i in $(seq 1 120); do
              getent hosts "$w" &>/dev/null && { echo "[$HOSTNAME] $w is resolvable."; break; } || true
              sleep 5
            done
          done
          export TPU_WORKER_HOSTNAMES="${W0},${W1}"
          export TPU_PROCESS_ADDRESSES="${W0}:8471,${W1}:8471"
          echo "[$HOSTNAME] TPU_WORKER_ID=${TPU_WORKER_ID}, TPU_WORKER_HOSTNAMES=${TPU_WORKER_HOSTNAMES}"

          # 2-host multi-controller run: pyconfig calls jax.distributed.initialize() which
          # auto-discovers coordinator via PJRT TPU metadata once worker addresses are set.
          # TP=4, EP=4 spreads the 412 GB BF16 model across all 16 JAX devices.
          # num_kv_heads=4 must be divisible by TP; EP=4 works with 128 routed experts.
          /opt/venv/bin/python \
            -m maxtext.checkpoint_conversion.standalone_scripts.quantize_params_ptq \
            src/maxtext/configs/base.yml \
            model_name=mimo-v2-flash \
            run_name=mimo_ptq_quantize \
            load_parameters_path=gs://jingnw-mimo-v2-flash-us-central1/mimo-v2-flash-fixed-ocdbt/checkpoints/0/items \
            save_quantized_params_path=gs://jingnw-mimo-v2-flash-us-central1/mimo-v2-flash-fp8-ptq/0/items \
            use_qwix_quantization=true \
            quantization=fp8_full \
            checkpoint_is_quantized=false \
            ici_tensor_parallelism=4 \
            ici_expert_parallelism=4 \
            max_target_length=128 \
            per_device_batch_size=1 \
            attention=dot_product \
            checkpoint_storage_use_ocdbt=true \
            checkpoint_storage_use_zarr3=false \
            async_checkpointing=false
        resources:
          requests:
            cpu: "10"
            memory: 750Gi
            google.com/tpu: "4"
          limits:
            cpu: "10"
            memory: 750Gi
            google.com/tpu: "4"
